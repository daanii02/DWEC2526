<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Drum Box simple</title>
  <link rel="stylesheet" href="css.css">
</head>
<body>
  <h1>Drum Box</h1>

  <p>
    Pulsa las teclas para crear ritmos
  </p>

 <div class="pads1">
  <div class="pad" id="pad1" data-sound="sound1">Q</div>
  <div class="pad" id="pad2" data-sound="sound2">W</div>
  <div class="pad" id="pad3" data-sound="sound3">E</div>
  <div class="pad" id="pad4" data-sound="sound4">R</div>
</div>
<div class="pads">
  <div class="pad" id="pad5" data-sound="sound5">A</div>
  <div class="pad" id="pad6" data-sound="sound6">S</div>
  <div class="pad" id="pad7" data-sound="sound7">D</div>
  <div class="pad" id="pad8" data-sound="sound8">F</div>
</div>
<div class="pads">
  <div class="pad" id="pad9" data-sound="sound9">Z</div>
  <div class="pad" id="pad10" data-sound="sound10">X</div>
  <div class="pad" id="pad11" data-sound="sound11">C</div>
  <div class="pad" id="pad12" data-sound="sound12">V</div>
</div>


<audio id="sound1"  src="sounds/1.wav" preload="auto"></audio>
<audio id="sound2"  src="sounds/2.wav" preload="auto"></audio>
<audio id="sound3"  src="sounds/3.wav" preload="auto"></audio>
<audio id="sound4"  src="sounds/4.wav" preload="auto"></audio>
<audio id="sound5"  src="sounds/5.wav" preload="auto"></audio>
<audio id="sound6"  src="sounds/6.wav" preload="auto"></audio>
<audio id="sound7"  src="sounds/7.wav" preload="auto"></audio>
<audio id="sound8"  src="sounds/8.wav" preload="auto"></audio>
<audio id="sound9"  src="sounds/9.wav" preload="auto"></audio>
<audio id="sound10" src="sounds/10.wav" preload="auto"></audio>
<audio id="sound11" src="sounds/11.wav" preload="auto"></audio>
<audio id="sound12" src="sounds/12.wav" preload="auto"></audio>



  <script src="js.js"></script>
</body>
</html>
