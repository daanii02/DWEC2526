<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora con Log</title>
    <link rel="stylesheet" href="css.css">
    <script src="js.js" defer></script>
</head>
<body>
    

  <div class="fila-operaciones">
    
    <label for="op1">Numero 1</label>
    <input type="number" id="op1"/>
      
    
    <button id="btnSuma">➕</button>
    <button id="btnResta">➖</button>
    <br>
    <label for="op2">Numero 2</label>
    <input type="number" id="op2"/>
   
    
    <button id="btnMulti">✖️</button>
    <button id="btnDiv">➗</button>
  </div>
  <center>
   <div id="resultadoBox" class="resultado-grande">
    <input id="resultado" type="text" readonly/>
  </div>
  </center>
  <div id="log" class="log-operaciones">
    <button id="btnLimpiar">Limpiar log</button>
    <h3>Log de Operaciones</h3> 
    <div id="contenidoLog"></div>

  </div>

  
</body>
</html>
